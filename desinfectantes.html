<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desinfectantes | Poolcenter</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="nav-fijo">
        <a href="index.html" class="btn-volver">← Menú Principal</a>
        <h2 id="titulo-pagina">Quimicos Desinfectantes</h2>
    </nav>

    <main class="contenedor">
        <div class="grid-productos" id="grid-marcas"></div>
    </main>

    <div id="modal-variantes" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <h2 id="modal-titulo"></h2>
            <div class="grid-variantes" id="grid-variantes-body">
                </div>
        </div>
    </div>

    <script src="productos.js"></script>
    <script>
    const gridMarcas = document.getElementById('grid-marcas');
    const modal = document.getElementById('modal-variantes');

    // Paso 1: Mostrar las marcas principales (Clorizide, Trizide...)
    function mostrarMarcas() {
        const lista = catalogo.desinfectantes; 
        gridMarcas.innerHTML = "";

        lista.forEach((item, index) => {
            gridMarcas.innerHTML += `
                <div class="card-marca" onclick="abrirVariantes(${index})">
                    <div class="contenedor-img-card">
                        <img src="img/${item.imagenPrincipal}" alt="${item.grupo}">
                        <div class="capa-descripcion">
                            <p>${item.descripcion || "Producto de alta calidad para tu piscina."}</p>
                        </div>
                    </div>
                    <span class="marca-tag">${item.marca}</span>
                    <h3>${item.grupo}</h3>
                    <p class="ver-mas">Toca para ver presentaciones</p>
                </div>
            `;
        });
    } // <-- Aquí se cierra correctamente mostrarMarcas

    // Paso 2: Al hacer click, abrir el modal con las variantes
    function abrirVariantes(index) {
        const grupo = catalogo.desinfectantes[index];
        const container = document.getElementById('grid-variantes-body');
        document.getElementById('modal-titulo').innerText = grupo.grupo;
        
        container.innerHTML = "";

        grupo.variantes.forEach(v => {
            let etiquetasPeso = v.pesos.map(p => 
                `<span class="etiqueta-peso">${p}</span>`
            ).join("");

            container.innerHTML += `
                <div class="card-variante">
                    <img src="img/${v.imagen}" alt="${v.subtitulo}">
                    <h4>${v.subtitulo}</h4>
                    <div class="lista-pesos">
                        ${etiquetasPeso}
                    </div>
                </div>
            `;
        });

        modal.style.display = "block";
    }

    // Función para el botón de WhatsApp (opcional si decides usarlo luego)
    function pedir(nombre, sub, peso) {
        const msg = `Hola Poolcenter, me interesa ${nombre} (${sub}) de ${peso}.`;
        window.open(`https://wa.me/50585141042?text=${encodeURIComponent(msg)}`);
    }

    function cerrarModal() { 
        modal.style.display = "none"; 
    }

    window.onclick = (e) => { 
        if(e.target == modal) cerrarModal(); 
    }

    // Ejecutar al cargar la página
    window.onload = mostrarMarcas;
</script>
</body>
</html>
